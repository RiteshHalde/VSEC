<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marksheet Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>India Council Of Marksheet</h1>
  
  <form id="Marks">
    <label class="Username">
      Enter Your Name: 
      <input type="text" id="username" placeholder="Your Name Here !!" style="width: 200px; height: 20px;" required>
    </label>
    <br><br>

    <label class="marks">
      Enter Your Physics Marks: 
      <input type="number" min="0" max="100" placeholder="Physics Marks" id="Phy" style="width: 100px; height: 20px;" required>
    </label>
    <br><br>

    <label class="marks">
      Enter Your Chemistry Marks: 
      <input type="number" min="0" max="100" placeholder="Chemistry Marks" id="chem" style="width: 120px; height: 20px;" required>
    </label>
    <br><br>

    <label class="marks">
      Enter Your Mathematics Marks: 
      <input type="number" min="0" max="100" placeholder="Mathematics Marks" id="math" style="width: 150px; height: 20px;" required>
    </label>
    <br><br>


    <!-- <h3 id="name"></h3> -->
    <h3 id="result"></h3>
    <h3 id="percentage"></h3>

    <button type="submit" >Submit</button>

  </form>

  <br><br><br>
  <table border="2" id="t1">
    <tr>
      <th>Name</th>
      <th>Physics</th>
      <th>Chemistry</th>
      <th>Mathematics</th>
      <th>Total</th>
      <th>Percentage</th>
    </tr>
  </table>

  <script src="Javascript/marks.js"></script>
</body>
</html>
