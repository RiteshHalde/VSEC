<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBTCOE Login Page</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1>Login Page</h1>
    <form id="loginForm">
        <!-- Username -->
        <label>
            Enter Your Username:
        </label>
        <br>

        <input type="text" id="username" placeholder="Enter Your Gmail ID" maxlength="20" required>
        <br><br>

        <!-- Password -->
        <label>Enter Your Password:</label>
        <br>

        <input
            type="password" id="password" placeholder="Enter Your Password" maxlength="20"required>
        <br><br>

        <!-- Login Button -->
        <button type="submit"> Log In </button>
    </form>
    <!-- JavaScript -->
    <script src="Script.js"></script>
</body>

</html>
